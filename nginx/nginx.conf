worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 500;
    server_tokens off;
    client_max_body_size 50m;

    # ── Global proxy ───────────────────────────────────────────────────────────
    proxy_connect_timeout 3s;
    proxy_send_timeout    15s;
    proxy_read_timeout    15s;
    proxy_buffering       on;
    proxy_buffer_size     8k;
    proxy_buffers         8 16k;

    # ── Gzip ───────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 3;
    gzip_min_length 256;
    gzip_types application/json text/plain text/xml application/xml;

    # ── Rate limiting ──────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=media:10m rate=10r/s;

    # ── Proxy cache ────────────────────────────────────────────────────────────
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=apicache:16m
                     max_size=256m inactive=20m use_temp_path=off;

    upstream app {
        server app:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        # ── Health ────────────────────────────────────────────────────────
        location /health {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # ── Auth (qattiq limit) ──────────────────────────────────────────
        location /api/auth {
            limit_req zone=auth burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # ── Media (provider scraping — uzunroq timeout) ──────────────────
        location /api/contents/media {
            limit_req zone=media burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
        }

        # ── Playback source selection (language/server dependent; no cache) ──
        location = /api/contents/episodes {
            limit_req zone=media burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
            proxy_cache off;
            add_header Cache-Control "private, no-store" always;
            add_header X-Cache-Status BYPASS always;
        }

        # ── Content (cache + proxy) ──────────────────────────────────────
        location /api/contents/ {
            limit_req zone=api burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 20s;

            proxy_cache_bypass $http_authorization;
            proxy_no_cache $http_authorization;
            proxy_cache apicache;
            proxy_cache_valid 200 3m;
            proxy_cache_valid 404 10s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ── Swagger ──────────────────────────────────────────────────────
        location /api-docs {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        # ── Qolgan API ──────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            limit_req_status 429;

            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location / {
            return 404 '{"message":"Not found"}';
            add_header Content-Type application/json;
        }
    }
}
